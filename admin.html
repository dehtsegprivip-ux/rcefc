// 🖼️ Convertir imagen
function convertirImagen(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = error => reject(error);
    reader.readAsDataURL(file);
  });
}

document.addEventListener("DOMContentLoaded", () => {

  document.getElementById("btnGuardar").addEventListener("click", async () => {

    try {
      const nombre = document.getElementById("nombre").value.trim();
      const apellido = document.getElementById("apellido").value.trim();
      const ocupacion = document.getElementById("ocupacion").value.trim();
      const localidad = document.getElementById("localidad").value.trim();
      const region = document.getElementById("region").value.trim();
      const archivo = document.getElementById("foto").files[0];

      if (!nombre || !apellido || !localidad || !region) {
        alert("Completa los campos obligatorios");
        return;
      }

      let fotoBase64 = "";

      if (archivo && archivo.size <= 300000) {
        fotoBase64 = await convertirImagen(archivo);
      }

      // 📍 Coordenadas
      let lat = null;
      let lng = null;

      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${localidad}, Chile`);
        const data = await res.json();

        if (data.length > 0) {
          lat = parseFloat(data[0].lat);
          lng = parseFloat(data[0].lon);
        }
      } catch (e) {
        console.warn("Error geolocalización");
      }

      // 🔥 GUARDAR EN FIREBASE
      await addDoc(collection(db, "personas"), {
        nombre,
        apellido,
        ocupacion,
        localidad,
        region,
        foto: fotoBase64,
        lat,
        lng,
        fecha: new Date()
      });
      
     // GUARDAR TAMBIÉN LOCALMENTE
      let datos = JSON.parse(localStorage.getItem("personas")) || [];
      datos.push({
        nombre,
        apellido,
        ocupacion,
        localidad,
        region
      });
      localStorage.setItem("personas", JSON.stringify(datos));

      // ACTUALIZAR LISTA
      mostrarLista();
      
      alert("Guardado correctamente ✔");

      limpiar();

    } catch (e) {
      console.error(e);
      alert("Error al guardar en Firebase");
    }
  });

    document.getElementById("nombre").value = "";

    document.getElementById("ocupacion").value = "";
    document.getElementById("localidad").value = "";
    document.getElementById("region").value = "";
    document.getElementById("foto").value = "";
  }

   async function cargarPendientes() {
     const contenedor = document.getElementById("pendientes");
     if (!contenedor) return;

     const snapshot = await getDocs(collection(db, "historias"));

     contenedor.innerHTML = "";

     snapshot.forEach((docSnap) => {
      const data = docSnap.data();
      
      if (data.aprobado === false) {
        const div = document.createElement("div");
        
       div.innerHTML = `
       <h4>${data.nombre} (${data.tipo})</h4>
       <p>${data.historia}</p>
       <button onclick="aprobar('${docSnap.id}')">Aprobar</button>
       `;

       contenedor.appendChild(div);
      }
     });
   }

   window.aprobar = async (id) => {
    try {
      const ref = doc(db, "historias", id);
      await updateDoc(ref, {
        aprobado: true,
        fechaAprobacion: new Date()
      });
      
      // Recargar ambas secciones
      await cargarPendientes();
      await cargarHistoriasAprobadas();

      alert("✅ Historia aprobada y publicada");
    } catch (e) {
      console.error("Error al aprobar:", e);
      alert("❌ Error al aprobar la historia");
    }
   };
      // Filtar solo historias aprobadas
      async function cargarHistoriasAprobadas() {
        const contenedor = document.getElementById("historias-aprobadas");
        if (!contenedor) return;

        try {
          const q = query(collection(db, "historias"), where("aprobado", "==", true));
          const snapshot = await getDocs(q);

          contenedor.innerHTML = "";

          if (snapshot.empty) {
            contenedor.innerHTML = "<p>No hay historias aprobadas aún</p>";
            return;
          }

          snapshot.forEach((docSnap) => {
            const data = docSnap.data();
            const div = document.createElement("div");
            div.className = "historia";

            let fechaStr = "";
            if (data.fechaAprobacion) {
              const fecha = data.fechaAprobacion.toDate?.() || data.fechaAprobacion;
              fechaStr = new Date(fecha).toLocaleDateString();
            }

            div.innerHTML = `
            <h4>${data.nombre} (${data.tipo})</h4>
            <p><em>${data.historia}</em></p>
            <small>📅 ${fechaStr}</small>
            `;
            
            contenedor.appendChild(div);
          });
        } catch (e) {
          console.error("Error cargando historias aprobadas:", e);
        }
      }

  option.textContent = region;
  selectRegion.appendChild(option);
}

selectRegion.addEventListener("change", () => {
  const regionSeleccionada = selectRegion.value;

  selectComuna.innerHTML = '<option value="">Selecciona Comuna</option>';

// 📋 LISTA
function mostrarLista() {
  const lista = document.getElementById("lista");
  lista.innerHTML = "";

  if (datos.length === 0) {
    lista.innerHTML = "<p>No hay registros</p>";
    return;
  }

  datos.forEach((p, index) => {
    const div = document.createElement("div");
    div.className = "item";

    div.innerHTML = `
      <b>${p.nombre} ${p.apellido}</b><br>
      ${p.ocupacion || "Sin ocupación"}<br>
      ${p.localidad} - ${p.region}
    `;

    const btn = document.createElement("button");
    btn.textContent = "❌";
    btn.className = "eliminar";
    btn.onclick = () => eliminar(index);

    div.appendChild(btn);
    lista.appendChild(div);
  });
}

// ❌ ELIMINAR
function eliminar(index) {
  if (confirm("¿Eliminar este registro?")) {
    datos.splice(index, 1);
    localStorage.setItem("personas", JSON.stringify(datos));
    mostrarLista();
  }
}
